apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-qualite-air
  labels:
    app: qualite-air
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qualite-air
  template:
    metadata:
      labels:
        app: qualite-air
    spec:
      containers:
        # 1. Interface Web Streamlit
        - name: streamlit-app
          image: lpanier/alerte-qualite-air:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: DB_DIR
              value: "/app/data"
            - name: SMTP_SERVER
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_USER
              value: "leo.pa5334@gmail.com"
            - name: SMTP_PASSWORD
              value: "ptaiwyikgzpcwmhf"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: sqlite-stockage
              mountPath: /app/data

        # 2. Moteur d'alerte en arriere-plan
        - name: alerte-worker
          image: lpanier/alerte-qualite-air:latest
          imagePullPolicy: Always
          command:
            - "uv"
            - "run"
            - "python"
            - "-m"
            - "air_quality_app.moteur_alerte.core"
          env:
            - name: DB_DIR
              value: "/app/data"
            - name: SMTP_SERVER
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_USER
              value: "leo.pa5334@gmail.com"
            - name: SMTP_PASSWORD
              value: "ptaiwyikgzpcwmhf"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: sqlite-stockage
              mountPath: /app/data

      volumes:
        - name: sqlite-stockage
          persistentVolumeClaim:
            claimName: sqlite-data-pvc