apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-qualite-air
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: qualite-air-paleo.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-qualite-air
                port:
                  number: 8501